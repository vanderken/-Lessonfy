version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: lessonfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lessonfy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # High enough to survive pgAdmin query tabs; role limits below keep the app safe.
    command: >
      postgres
      -c max_connections=200
      -c superuser_reserved_connections=10
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=30000
    ports:
      - "5433:5432"
    volumes:
      - lessonfy_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  lessonfy_postgres_data:
