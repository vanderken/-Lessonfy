spring.datasource.url=jdbc:postgresql://localhost:5433/lessonfy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=lessonfy_app
spring.datasource.password=postgres

# Same connection ceiling as the default profile.
spring.datasource.hikari.pool-name=lessonfy-hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.data-source-properties.ApplicationName=lessonfy-app

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
