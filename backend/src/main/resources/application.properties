spring.application.name=Lessonfy
server.port=8080

# ---- Session cookie hardening ----
# Set SESSION_COOKIE_SECURE=true when deployed over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# ---- PostgreSQL (local blueprint database) ----
# Flyway creates and validates the blueprint schema in the lessonfy database.
spring.datasource.url=jdbc:postgresql://localhost:5433/lessonfy
spring.datasource.driver-class-name=org.postgresql.Driver
# Dedicated role with its own connection limit; pgAdmin uses the postgres role.
spring.datasource.username=${DB_USERNAME:lessonfy_app}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---- Connection pool ceiling ----
# Keep the backend far below PostgreSQL's max_connections=200.
spring.datasource.hikari.pool-name=lessonfy-hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.data-source-properties.ApplicationName=lessonfy-app

# ---- Tables are made by Flyway (db/migration/V1__init_schema.sql) ----
# Hibernate only CHECKS that the entities match the tables. It no longer edits them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=false

# ---- Automatic lesson creation ----
# Upload limits are enforced by Spring and again by DocumentExtractionService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- AI providers (keys stay in the backend environment) ----
lessonfy.ai.providers=${AI_PROVIDER_ORDER:gemini,groq,claude}
lessonfy.ai.total-timeout-seconds=${AI_TOTAL_TIMEOUT_SECONDS:50}
lessonfy.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:${GEMINI_TIMEOUT_SECONDS:20}}
lessonfy.ai.max-input-chars=${AI_MAX_INPUT_CHARS:${GEMINI_MAX_INPUT_CHARS:20000}}

# Google Gemini
lessonfy.ai.gemini.api-key=${GEMINI_API_KEY:}
lessonfy.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
lessonfy.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Groq (OpenAI-compatible)
lessonfy.ai.groq.api-key=${GROQ_API_KEY:}
lessonfy.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
lessonfy.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Claude / Anthropic (platform.claude.com)
lessonfy.ai.claude.api-key=${ANTHROPIC_API_KEY:}
lessonfy.ai.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com}
lessonfy.ai.claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
lessonfy.ai.claude.version=${CLAUDE_VERSION:2023-06-01}
